openapi: 3.0.0
info:
  title: Potion Shop Inventory API
  version: 1.0.0
  description: Simple API for listing and buying magical potions.

servers:
  - url: https://api.magic-shop.example.com

paths:
  /products:
    get:
      summary: List magical products
      description: Returns a paginated list of magical products in the shop.
      parameters:
        - name: limit
          in: query
          description: Maximum number of products to return.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of products to skip before starting to collect the result set.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of magical products.
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer
                    description: Total number of products available.
                  limit:
                    type: integer
                  offset:
                    type: integer

  /products/{productName}:
    get:
      summary: Get a magical product
      description: Returns details for a single magical product, including stock level.
      parameters:
        - name: productName
          in: path
          required: true
          description: Name of the product.
          schema:
            type: string
      responses:
        '200':
          description: Magical product details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - quantity
      properties:
        id:
          type: string
        name:
          type: string
          description: Display name of the product.
          example: Elder Wand
        type:
          type: string
          description: Type of the product
          enum: [charm, weapon, potion]
          example: charm
        image:
          type: string
          description: URL for the product image
        description:
          type: string
          description: Short description of the product.
          example: A legendary wand said to be unbeatable in duels.
        price:
          type: number
          format: float
          description: Price per unit.
          example: 249.99
        quantity:
          type: integer
          description: Units currently in stock.
          example: 3
        rarity:
          type: string
          description: Rarity classification of the product.
          enum: [common, rare, epic, legendary]
          example: legendary

    Error:
      type: object
      properties:
        code:
          type: string
          example: OUT_OF_STOCK
        message:
          type: string
          example: Not enough products in stock to fulfill this purchase.


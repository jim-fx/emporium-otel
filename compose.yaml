name: otel-shop

x-default-service: &default-service
  env_file: .env
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 30s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.2-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 30s
      retries: 5

  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "8085:80"
      - "2525:25"

  initializer:
    <<: *default-service
    image: denoland/deno:2.5.6
    profiles:
      - init
    working_dir: /app
    volumes:
      - ./initializer:/app
    restart: on-failure
    command: sh -c "deno task seed-db"

  storefront:
    <<: *default-service
    build:
      context: ./storefront
    working_dir: /app
    env_file: .env
    ports:
      - "8080:3000"
    volumes:
      - ./storefront:/app
      - node-modules:/app/node_modules
    command: sh -c "pnpm install && pnpm run dev"

  potion-seller:
    <<: *default-service
    image: cosmtrek/air
    working_dir: /app
    ports:
      - 8081:80
    volumes:
      - ./potion-seller:/app
      - go-cache:/go
    environment:
      OTEL_PROPAGATORS: "tracecontext,baggage"
      OTEL_SERVICE_NAME: "potion-seller"
    command: go run main.go

  weapon-seller:
    <<: *default-service
    environment:
      OTEL_DENO: true
      OTEL_DENO_CONSOLE: "ignore"
      OTEL_PROPAGATORS: "tracecontext,baggage"
      OTEL_SERVICE_NAME: "weapon-seller"
    image: denoland/deno:2.5.6
    working_dir: /app
    command: deno task dev
    ports:
      - 8082:80
    volumes:
      - ./weapon-seller:/app
      - deno-cache:/deno-dir

  charm-seller:
    <<: *default-service
    working_dir: /var/www/html
    build:
      context: ./charm-seller
    environment:
      OTEL_SERVICE_NAME: "charm-seller"
      OTEL_PROPAGATORS: "tracecontext,baggage"
      OTEL_LOG_LEVEL: "debug"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_TRACES_SAMPLER: "always_on"
      APP_DEBUG: 0
      APP_CACHE_DIR: /var/cache
    ports:
      - 8083:80
    volumes:
      - ./charm-seller:/var/www/html
      - ./docker/charm-seller/apache/app.conf:/etc/apache2/sites-enabled/000-default.conf

  order-service:
    <<: *default-service
    build:
      context: ./order-service
    working_dir: /app
    environment:
      CI: true
    command: sh -c "pnpm i && pnpm run start:dev"
    ports:
      - 8084:80
    volumes:
      - ./order-service:/app
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  scribe-worker:
    <<: *default-service
    build:
      context: ./scribe-worker
    environment:
      OTEL_SERVICE_NAME: "scribe-worker"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_PROPAGATORS: "tracecontext,baggage"
    volumes:
      - ./scribe-worker/src:/app
    depends_on:
      rabbitmq:
        condition: service_started
      smtp4dev:
        condition: service_started
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    # Needs root (or at least read access) to host FS, docker.sock and container logs.
    user: "0"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/otel-collector/config.yaml:/etc/otel-collector/config.yaml
    command: --config=/etc/otel-collector/config.yaml

  init:
    image: alpine:latest
    user: root
    command: >
      sh -c "mkdir -p /data/prometheus /data/loki /data/tempo /data/grafana &&
             chown -R 65534:65534 /data/prometheus &&
             chown -R 10001:10001 /data/loki &&
             chown -R 10001:10001 /data/tempo &&
             chown -R 472:472 /data/grafana &&
             chmod -R 775 /data"
    volumes:
      - observability_storage:/data

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - otel
    volumes:
      - ./docker/prometheus/config.yaml:/etc/prometheus/prometheus.yml
      - observability_storage:/data
    command: |
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/data/prometheus
      --web.enable-remote-write-receiver
      --web.enable-otlp-receiver
      --enable-feature=exemplar-storage
      --enable-feature=native-histograms
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  loki:
    image: grafana/loki:latest
    profiles:
      - otel
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/local-config.yaml
      - observability_storage:/data
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  tempo:
    image: grafana/tempo:latest
    profiles:
      - otel
    volumes:
      - ./docker/tempo/config.yaml:/etc/tempo.yaml
      - observability_storage:/data
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:latest
    profiles:
      - otel
    ports:
      - 3000:3000
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - observability_storage:/data
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_DATA=/data/grafana
      - GF_PATHS_LOGS=/data/grafana/log
      - GF_PATHS_PLUGINS=/data/grafana/plugins
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  observability_storage:
  go-cache:
  deno-cache:
  db-data:
  rabbitmq-data:
  node-modules:


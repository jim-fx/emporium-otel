name: Otel Item Shop
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql

  potion-seller:
      image: cosmtrek/air
      working_dir: /app
      env_file: .env
      ports:
          - 8080:8080
      volumes:
          - ./potion-seller:/app
          - go-cache:/go
  
  wand-seller:
      image: denoland/deno:2.5.6
      working_dir: /app
      command: deno task dev
      env_file: .env
      ports:
          - 8081:8081
      volumes:
          - ./wand-seller:/app
          - deno-cache:/deno-dir

  amulet-seller:
    image: php:8.3-apache
    working_dir: /var/www/html
    env_file: .env
    environment:
      APP_ENV: dev
    ports:
      - 8082:80
    volumes:
      - ./amulet-seller:/var/www/html

  storefront:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm i -g pnpm && pnpm install && pnpm run dev"
    env_file: .env
    ports:
      - "8083:3000"
    volumes:
      - ./storefront:/app
      - node-modules:/app/node_modules

volumes:
    go-cache:
    deno-cache:
    db-data:
    node-modules:

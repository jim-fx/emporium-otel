receivers:
  postgresql:
    endpoint: db:5432
    transport: tcp
    username: postgres
    password: postgres
    databases:
      - app
    tls:
      insecure: true
    collection_interval: 10s
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    include_file_path: false
    include_file_name: false
    poll_interval: 200ms
    operators:
      - id: docker-parser
        type: container
        format: docker
        add_metadata_from_filepath: false

      - id: docker-tag-split
        type: regex_parser
        if: 'attributes["attrs"] != nil && attributes["attrs"]["tag"] != nil'
        parse_from: attributes["attrs"]["tag"]
        regex: '^(?P<container_name>[^|]+)\|(?P<container_image>[^|]+)\|(?P<container_id>[^|]+)$'

      - id: copy-container-id
        type: copy
        if: 'attributes["container_name"] != nil'
        from: attributes["container_name"]
        to: resource["service.name"]

      - id: move-service-name
        type: move
        if: 'attributes["container_name"] != nil'
        from: attributes["container_name"]
        to: resource["docker.container_name"]

      - id: move-image-name
        type: move
        if: 'attributes["container_image"] != nil'
        from: attributes["container_image"]
        to: resource["docker.image.name"]

      - id: move-container-id
        type: move
        if: 'attributes["container_id"] != nil'
        from: attributes["container_id"]
        to: resource["docker.container_id"]

      - id: drop-attrs-tag
        type: remove
        if: 'attributes["attrs"] != nil && attributes["attrs"]["tag"] != nil'
        field: attributes["attrs"]["tag"]

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:
  filter/otel-logs:
    logs:
      include:
        match_type: regexp
        resource_attributes:
          - key: docker.container_name
            value: ^otel-

exporters:
  otlphttp/metrics:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
  otlphttp/traces:
    endpoint: http://tempo:4418
    tls:
      insecure: true
  otlphttp/logs:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]
    metrics:
      receivers: [otlp, docker_stats, postgresql]
      processors: [batch]
      exporters: [otlphttp/metrics]
    logs:
      receivers: [filelog/docker]
      processors: [filter/otel-logs, batch]
      exporters: [otlphttp/logs]
